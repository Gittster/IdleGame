<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Idle Game — Combat Prototype</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0a0a0d;
        overflow: hidden;
        height: 100%;
        touch-action: none;
        overscroll-behavior: none;
      }
      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        /* dvh/dvw track the *actual* visible viewport as a mobile browser's
           address bar collapses/expands; 100vh alone leaves a stale gap
           (or overflow) on phones until this is supported (all current
           mobile browsers), so it's a progressive enhancement over the
           vw/vh fallback above. */
        width: 100dvw;
        height: 100dvh;
        touch-action: none;
      }
      canvas {
        image-rendering: pixelated;
        touch-action: none;
      }
      /* Sits over the Phaser canvas for the Town/inventory UI. Left
         click-through (pointer-events: none) by default so it never
         swallows combat input — individual React components opt back
         into pointer-events: auto where they're actually interactive. */
      #ui-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
